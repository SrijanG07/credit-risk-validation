[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-validation"
version = "1.0.0"
description = "Reproducible credit-default model validation and monitoring workbench"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<1.9", "matplotlib>=3.9,<4", "xlrd==2.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
credit-risk = "credit_risk.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
